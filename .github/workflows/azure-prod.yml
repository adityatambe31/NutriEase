name: Azure CI/CD - Production
on:
  # Archived workflow kept for reference only.
  # Intentionally disabled from automatic execution.
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: false # Archived: do not run
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    environment: production
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_FLOWER_04CB6340F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: 'upload'
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: '/' # App source code path
          api_location: '' # Api source code path - optional
          output_location: '' # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
        env:
          NEXT_PUBLIC_ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_GEMINI_API_KEY_COOK: ${{ secrets.GEMINI_API_KEY_COOK }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
          NEXT_PUBLIC_PEXEL_API_KEY: ${{ secrets.PEXEL_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODBURI }}
          NEXTAUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_MICROSOFT_ENTRA_ID_ID: ${{ secrets.MICROSOFT_ENTRA_ID_ID }}
          AUTH_MICROSOFT_ENTRA_ID_SECRET: ${{ secrets.MICROSOFT_ENTRA_ID_SECRET }}
          AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${{ secrets.MICROSOFT_ENTRA_ID_ISSUER }}
          AUTH_GOOGLE_ID: ${{ secrets.GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.GITHUBID }}
          AUTH_GITHUB_SECRET: ${{ secrets.GITHUBSECRET }}
